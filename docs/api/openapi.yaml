        \ this.\n\n**The unit of work is one answer, not one attempt.** WF 15 serves \"Youssef T. — Q4\
        \ (structured answer)\" with its own score box. Grader attribution lives on the answer. `GET /grading/queue/next`\
        \ takes a soft claim so Skip does not re-serve the same essay.\n\nEach item\
