  /answers/{answerId}/grade:
    patch:
      tags:
      - Grading
      operationId: gradeAnswer
      summary: Grade one answer
      description: "**\"Save\" on WF 15.** Writes `points_awarded` and an optional `evaluator_comment`,\
        \ stamps `graded_by_user_id` and `graded_at`, and clears any claim.\n\nThree validation rules\
        \ apply:\n\n- `0 <= points_awarded <= question.points` → `422 POINTS_EXCEED_QUESTION`\n- only\
        \ `STRUCTURED` answers are human-graded → `422 NOT_MANUALLY_GRADABLE` on an MCQ\n- the grader\
        \ must hold `can_grade` on the answer's group → `403`\n\n**Authorization.** Every endpoint in\
        \ this group requires `can_grade` on the group that owns the answer, resolved through `attempt\
        \ → quiz → group`, with `is_revoked = false`. The course's owning instructor always passes. A\
        \ TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\n**Roles:** I, A  \n**Ownership\
        \ scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n**Status:** ✅ Specifiable — fully\
        \ backed by the ERD."
      parameters:
