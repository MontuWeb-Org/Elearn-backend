# Generated for GitBook. Source of truth: docs/erd.md + docs/api-resource-map.md
openapi: 3.1.0
info:
  title: Montu E-Learning Platform API
  version: 0.1.0-draft
  description: |-
    REST API for the Montu e-learning platform — a centralized LMS for independent IGCSE and American-Diploma instructors, serving four linked tiers: instructor, teaching assistant, parent and student.

    **This is a specification, not a description of running code.** The backend is scaffolding only. Every endpoint is derived from the entity-relationship diagram and the 24-screen wireframe set, and each one carries a status line saying whether it is fully backed by the schema, depends on an open decision, or is blocked on a missing entity.

    Read the *Concepts* section first — the path conventions, the role and ownership model, the two-branch rule and the error catalog apply to every operation and are not repeated per endpoint.
  contact:
    name: Montu Tech
servers:
- url: https://api.montu.example/api/v1
  description: Production (not yet deployed)
- url: http://localhost:3000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Login, token rotation, sign-up, password reset and profile.
- name: Invites
  description: Instructor-issued invites — the only route to a TA, student or parent account.
- name: Billing
  description: Instructor → platform subscriptions. Distinct from student fees.
- name: Courses
  description: The curriculum root.
- name: Chapters
  description: Chapters within a course.
- name: Lessons
  description: Lessons within a chapter, and publish state.
- name: Materials
  description: Files attached to a lesson.
- name: Recordings
  description: On-demand video attached to a lesson.
- name: Uploads
  description: Signed upload targets. Transport only.
- name: Assignments
  description: Homework — curriculum branch, checked for on-time submission, never scored.
- name: Groups
  description: Cohorts, called "sections" in the wireframes.
- name: Assistants
  description: TA scope and the three permission flags.
- name: Scheduling
  description: Live sessions, onsite and online.
- name: Attendance
  description: Recorded against a live session, never against a lesson.
- name: Quizzes
  description: Timed assessments — cohort branch, issued to one group.
- name: Quiz attempts
  description: The student-side attempt lifecycle.
- name: Grading
  description: The TA grading queue for structured answers.
- name: Roster
  description: Students and their computed aggregates.
- name: Dashboards
  description: Per-role landing screens.
- name: Fees
  description: Student → instructor payments.
- name: Parent portal
  description: Read-only views of linked children.
- name: Notifications
  description: The in-app feed.
- name: Events
  description: Server-Sent Events — the real-time transport.
- name: Student portal
  description: Enrollment-scoped reads.
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in
      description: "Exchanges credentials for an access token and a refresh token. The response carries\
        \ the caller's roles and a `routing_target`, because one login serves all four tiers and the server\
        \ decides where the client lands (WF 01).\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:**\
        \ 01\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
  /auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Rotate refresh token
      description: "Exchanges a refresh token for a new pair. The old token is revoked on use — rotation\
        \ is backed by `USER_SESSIONS.refresh_token_hash`.\n\n**Roles:** —  \n**Ownership scope:** — \
        \ \n**Wireframe:** —\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/401'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Log out
      description: "Revokes the current session by setting `USER_SESSIONS.is_revoked`.\n\n**Roles:** all\
        \  \n**Ownership scope:** self  \n**Wireframe:** —\n\n**Status:** ✅ Specifiable — fully backed\
        \ by the ERD."
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Current user
      description: "The caller's profile, roles and routing target.\n\n**Roles:** all  \n**Ownership scope:**\
        \ self  \n**Wireframe:** all\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /auth/register:
    post:
      tags:
      - Authentication
      operationId: registerInstructor
      summary: Register as instructor
      description: "Step 1 of 3 of instructor sign-up. Creates the `USERS` row, the `TEACHERS` profile\
        \ and the `TEACHER` role assignment. Only instructors may self-register; every other account arrives\
        \ by invite.\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:** 02\n\n**Status:** ⚠️\
        \ WF 02 captures a single `full_name`, plural `subjects_taught` and a curriculum choice (IGCSE\
        \ / American Diploma / Both). `USERS` splits `first_name`/`last_name`, `TEACHERS.specialization`\
        \ is one string, and no curriculum field exists anywhere (gaps A21, G16). The three fields below\
        \ are documented against the wireframe and await a schema change."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
  /auth/password/forgot:
    post:
      tags:
      - Authentication
      operationId: forgotPassword
      summary: Request a password reset
      description: "Sends a reset link. **Always returns 202**, whether or not the address matches an\
        \ account — leaking account existence is the failure mode here (WF 03).\n\n**Roles:** —  \n**Ownership\
        \ scope:** —  \n**Wireframe:** 03\n\n**Status:** \U0001F6AB Blocked — no `PASSWORD_RESET_TOKENS`\
        \ entity exists (G5). The shape below is proposed, not final."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
  /auth/password/reset:
    post:
      tags:
      - Authentication
      operationId: resetPassword
      summary: Reset a password
      description: "Consumes a reset token and sets a new password. Expired links offer a resend (WF 03).\n\
        \n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:** 03\n\n**Status:** \U0001F6AB Blocked\
        \ — no `PASSWORD_RESET_TOKENS` entity exists (G5). The shape below is proposed, not final."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400'
  /me/profile:
    get:
      tags:
      - Authentication
      operationId: getProfile
      summary: Get own profile
      description: "Profile tab on WF 13 (instructor) and WF 19 (student).\n\n**Roles:** all  \n**Ownership\
        \ scope:** self  \n**Wireframe:** 13, 19\n\n**Status:** ⚠️ No avatar or display-name field exists\
        \ on `USERS` (gap A25), and no student-editable profile fields are defined (A26)."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
      - Authentication
      operationId: updateProfile
      summary: Update own profile
      description: "Partial update. Only fields present in the body are changed.\n\n**Roles:** all  \n\
        **Ownership scope:** self  \n**Wireframe:** 13, 19\n\n**Status:** ⚠️ See `GET /me/profile`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/sessions:
    get:
      tags:
      - Authentication
      operationId: listSessions
      summary: List active devices
      description: "Active refresh-token sessions with user agent and IP.\n\n**Roles:** all  \n**Ownership\
        \ scope:** self  \n**Wireframe:** —\n\n**Status:** ⚠️ `USER_SESSIONS` stores `user_agent`, `ip_address`,\
        \ `is_revoked` and `expires_at`, but no screen lists or revokes sessions (gap B3). Documented\
        \ because the data exists."
      parameters:
      - &id001
        name: limit
        in: query
        required: false
        description: Page size (default 25, max 100).
        schema:
          type: integer
          default: 25
          maximum: 100
      - &id002
        name: cursor
        in: query
        required: false
        description: Opaque cursor from a previous response's `page.next_cursor`.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/sessions/{sessionId}:
    delete:
      tags:
      - Authentication
      operationId: revokeSession
      summary: Revoke a device
      description: "Sets `is_revoked` on one session.\n\n**Roles:** all  \n**Ownership scope:** self \
        \ \n**Wireframe:** —\n\n**Status:** ⚠️ See `GET /me/sessions`."
      parameters:
      - name: sessionId
        in: path
        required: true
        description: The session to revoke.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /invites:
    post:
      tags:
      - Invites
      operationId: createInvite
      summary: Issue an invite
      description: "Issues an invite for a teaching assistant, student or parent.\n\n**The issuer may\
        \ be an instructor or a student.** `INVITES.issued_by_user_id` references `USERS`, not `TEACHERS`,\
        \ because a student may invite their own parent — WF 05 allows the instructor to invite parent\
        \ and student together, *or* the student to add a parent later from their own settings. A student\
        \ may issue only a `PARENT` invite, and only with `linked_student_id` set to themselves.\n\nScope\
        \ is role-shaped and is stored as `INVITE_GROUPS` rows mirroring `GROUP_ASSISTANTS`:\n\n- `ASSISTANT`\
        \ — the groups, plus `can_take_attendance` / `can_grade` / `can_upload_solutions`\n- `STUDENT`\
        \ — the groups to enroll into; the permission flags are ignored\n- `PARENT` — no groups; `linked_student_id`\
        \ names the child\n\nEvery scoped group must belong to a course the issuing instructor owns.\n\
        \n**Roles:** I, S  \n**Ownership scope:** own-course / self  \n**Wireframe:** WF 13, WF 05\n\n\
        **Status:** ⚠️ A partial unique index allows only one live invite per `(email, role, issuer)`.\
        \ Whether re-inviting the same address updates that invite or returns `409` is undecided; the\
        \ index assumes update."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    get:
      tags:
      - Invites
      operationId: listInvites
      summary: List pending invites
      description: "Invites issued by the caller that are still outstanding — neither accepted nor rescinded.\n\
        \n**Roles:** I, S  \n**Ownership scope:** own-course / self  \n**Wireframe:** WF 13\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: role
        in: query
        required: false
        description: Filter by invited role.
        schema:
          $ref: '#/components/schemas/RoleName'
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /invites/{inviteId}:
    delete:
      tags:
      - Invites
      operationId: revokeInvite
      summary: Rescind an invite
      description: "Rescinds a pending invite by stamping `revoked_at`. **The row is not deleted** — it\
        \ stays as an audit record, and the token stops working immediately.\n\n**Roles:** I, S  \n**Ownership\
        \ scope:** own-course / self  \n**Wireframe:** WF 13\n\n**Status:** ⚠️ Who may rescind a *student-issued*\
        \ parent invite — the student, the instructor who owns the classroom, or both — is undecided (gap\
        \ D40). `revoked_at` records that it happened, not who did it; add `revoked_by_user_id` if that\
        \ distinction matters."
      parameters:
      - name: inviteId
        in: path
        required: true
        description: The invite to rescind.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /invite-tokens/{token}:
    get:
      tags:
      - Invites
      operationId: previewInvite
      summary: Preview an invite
      description: "**Public.** Returns the inviter's name, the offered role, and the scope rendered as\
        \ prose.\n\nThis is what WF 04 shows a teaching assistant before they activate: *\"Mr. Ahmed invited\
        \ you as a Teaching Assistant — you'll have access to: attendance, grading, and homework uploads\
        \ for his classes.\"* The name comes from joining the invite to its issuing user; the sentence\
        \ is built from the `INVITE_GROUPS` rows and their flags.\n\nA token that is spent, rescinded\
        \ or expired returns `410`, never `404` — the recipient followed a real link and should be told\
        \ it is no longer valid rather than that it never existed.\n\n**Roles:** —  \n**Ownership scope:**\
        \ —  \n**Wireframe:** WF 04, WF 05\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: The invite token from the emailed link.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          $ref: '#/components/responses/404'
        '410':
          $ref: '#/components/responses/410'
  /invite-tokens/{token}/accept:
    post:
      tags:
      - Invites
      operationId: acceptInvite
      summary: Accept an invite
      description: "Consumes the invite and materializes everything it promised, in one transaction:\n\
        \n| Role | Acceptance writes |\n|---|---|\n| `ASSISTANT` | One `GROUP_ASSISTANTS` row per scoped\
        \ group, flags copied verbatim |\n| `STUDENT` | One `STUDENT_GROUPS` row per scoped group |\n\
        | `PARENT` | One `PARENT_STUDENTS` row against `linked_student_id` |\n\n**The address may already\
        \ have an account.** A parent already linked to a child under a different instructor accepts by\
        \ *attaching* — a new link row on the existing user — not by creating a second account. `accepted_user_id`\
        \ records which account the invite resolved to either way. This is what makes one parent account\
        \ spanning multiple instructors work.\n\nReturns tokens and the routing target, so the client\
        \ lands on the right home screen: a TA on their dashboard already scoped to the assigned sections,\
        \ a student on theirs, a parent on parent home.\n\n**Roles:** —  \n**Ownership scope:** —  \n\
        **Wireframe:** WF 04, WF 05\n\n**Status:** ⚠️ Whether the token alone suffices, or the accepting\
        \ address must match `INVITES.email`, is undecided (gap D39). Token-only is standard and means\
        \ a forwarded invite still works."
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: The invite token.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '410':
          $ref: '#/components/responses/410'
  /plans:
    get:
      tags:
      - Billing
      operationId: listPlans
      summary: List subscription plans
      description: "Plan tiers for sign-up step 2.\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:**\
        \ 02\n\n**Status:** ⚠️ WF 02 sizes the plan on student count **and TA seats**, but `SUBSCRIPTION_PLANS`\
        \ has only `max_students` — whether TAs consume seats is undecided (gap D20)."
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
  /subscriptions:
    post:
      tags:
      - Billing
      operationId: createSubscription
      summary: Subscribe to a plan
      description: "Sign-up step 3. Payment processing is delegated to a provider; this endpoint takes\
        \ the provider's token and records the `SUBSCRIPTIONS` row.\n\n**Roles:** I  \n**Ownership scope:**\
        \ self  \n**Wireframe:** 02\n\n**Status:** ⚠️ Payment provider integration is out of scope for\
        \ this document."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/subscription:
    get:
      tags:
      - Billing
      operationId: getSubscription
      summary: Get own subscription
      description: "Billing tab on WF 13.\n\n**Roles:** I  \n**Ownership scope:** self  \n**Wireframe:**\
        \ 13\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
      - Billing
      operationId: updateSubscription
      summary: Change or cancel plan
      description: "Switches plan or sets `status = CANCELLED`.\n\n**Roles:** I  \n**Ownership scope:**\
        \ self  \n**Wireframe:** 13\n\n**Status:** ⚠️ No screen edits plan limits or subscription state\
        \ (gap B2)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /courses:
    get:
      tags:
      - Courses
      operationId: listCourses
      summary: List courses
      description: "The instructor's courses. A TA sees courses of groups they are assigned to.\n\n**Roles:**\
        \ I, A  \n**Ownership scope:** own-course / assigned-group  \n**Wireframe:** 06, 07\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by lifecycle status.
        schema:
          $ref: '#/components/schemas/CourseStatus'
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      tags:
      - Courses
      operationId: createCourse
      summary: Create a course
      description: "New courses start as `DRAFT`.\n\n**Roles:** I  \n**Ownership scope:** self  \n**Wireframe:**\
        \ 02, 07\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /courses/{courseId}:
    get:
      tags:
      - Courses
      operationId: getCourse
      summary: Get a course
      description: "Course header — WF 07's \"IG Physics — Term 1\".\n\n**Roles:** I, A  \n**Ownership\
        \ scope:** own-course  \n**Wireframe:** 07\n\n**Status:** ⚠️ \"Term\" has no entity. A term is\
        \ folded into the course, i.e. one course per term (gap G14). Confirm before building."
      parameters:
      - &id003
        name: courseId
        in: path
        required: true
        description: The course.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
      - Courses
