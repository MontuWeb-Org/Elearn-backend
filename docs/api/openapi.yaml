  /quizzes/{quizId}/attempts:
    post:
      tags:
      - Quiz attempts
      operationId: startAttempt
      summary: Start an attempt
      description: "Begins the quiz. Sets `started_at` and **materializes** `expires_at` as `min(started_at\
        \ + duration_seconds, quiz.closes_at)`.\n\nThe expiry is stored rather than recomputed on every\
        \ read so the countdown, the auto-submit and late-answer rejection all agree on one authoritative\
        \ instant.\n\n`UNIQUE (quiz_id, student_id)` means one attempt per student — **retakes are not\
        \ modelled**. A second call returns 409.\n\n**Roles:** S  \n**Ownership scope:** own-enrollment\
        \  \n**Wireframe:** 22\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - *id012
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
