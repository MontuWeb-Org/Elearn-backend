      description: "Courses the caller is enrolled in, reached through `STUDENT_GROUPS`.\n\nStudents never\
        \ browse courses directly — they reach curriculum *through* a group enrollment, which is why these\
        \ reads live under `/me`.\n\n**Roles:** S  \n**Ownership scope:** own-enrollment  \n**Wireframe:**\
        \ 19, 20\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrolledCourse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/courses/{courseId}/lessons:
    get:
      tags:
      - Student portal
      operationId: listMyLessons
      summary: My lessons
      description: "**Published lessons only**, grouped by chapter, each with its materials, recordings\
        \ and progress chip. Drafts are invisible to students and parents.\n\n**Roles:** S  \n**Ownership\
        \ scope:** own-enrollment  \n**Wireframe:** 20\n\n**Status:** \U0001F6AB Blocked — doubly. The\
        \ published filter needs `LESSONS.status` (G3), and the `Done` / `In progress` chip needs per-student\
        \ progress data that does not exist (G8, gap C5). Whether a published material inside a draft\
        \ lesson is visible is also undecided (gap D2). The shape below is proposed, not final."
      parameters:
      - *id003
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonProgress'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/assignments:
    get:
      tags:
      - Student portal
      operationId: listMyAssignments
      summary: My homework
      description: "Homework due soon across every enrolled course, sorted by deadline.\n\n**Roles:**\
        \ S  \n**Ownership scope:** own-enrollment  \n**Wireframe:** 19, 23\n\n**Status:** ✅ Specifiable\
        \ — fully backed by the ERD."
      parameters:
      - name: due_before
        in: query
        required: false
        description: Only work due before this instant.
        schema:
          type: string
          format: date-time
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StudentAssignment'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/quizzes:
    get:
      tags:
      - Student portal
      operationId: listMyQuizzes
      summary: My quizzes
      description: "Quizzes open now or opening soon, ordered by `closes_at`.\n\n**Roles:** S  \n**Ownership\
        \ scope:** own-enrollment  \n**Wireframe:** 19, 22\n\n**Status:** ✅ Specifiable — fully backed\
        \ by the ERD."
      parameters:
      - name: state
        in: query
        required: false
        description: '`open`, `upcoming` or `closed`.'
        schema:
          type: string
          enum:
          - open
          - upcoming
          - closed
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StudentQuiz'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/grades:
    get:
      tags:
      - Student portal
      operationId: listMyGrades
      summary: My grades
      description: "Recent graded attempts.\n\n**Roles:** S  \n**Ownership scope:** own-enrollment  \n\
        **Wireframe:** 19\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AttemptResult'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/schedule:
    get:
      tags:
      - Student portal
      operationId: getMySchedule
      summary: My schedule
      description: "Next session and upcoming classes, with join state.\n\n**Roles:** S  \n**Ownership\
        \ scope:** own-enrollment  \n**Wireframe:** 19\n\n**Status:** ⚠️ Join state depends on the missing\
        \ join-window field (gap A15)."
      parameters:
      - name: from
        in: query
        required: false
        description: Window start.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Window end.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LiveSession'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/login` or `POST /auth/refresh`.
  schemas:
    Empty:
      type: object
      properties: {}
    PageEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
        page:
          type: object
          properties:
            limit: &id020
              type: integer
            cursor: &id019
              type:
              - string
              - 'null'
            next_cursor: *id019
            total: *id020
      description: Standard list envelope.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id021
              type: string
            message: *id021
            details:
              type: array
              items:
                type: object
                properties:
                  field: *id021
                  issue: *id021
          required:
          - code
          - message
      required:
      - error
      description: One problem shape for every failure. `code` is machine-readable and stable.
    ReorderRequest:
      type: object
      properties:
        order:
          type: array
          items: &id022
            type: string
            format: uuid
      required:
      - order
      description: The complete ordered list of ids. The server reassigns every `order_index` in one transaction.
    RoleName:
      type: string
      enum:
      - TEACHER
      - STUDENT
      - ASSISTANT
      - PARENT
      - ADMIN
    CourseStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
    SessionMode:
      type: string
      enum:
      - ONSITE
      - ONLINE
    SessionStatus:
      type: string
      enum:
      - SCHEDULED
      - COMPLETED
      - CANCELLED
    AttendanceStatus:
      type: string
      enum:
      - PRESENT
      - ABSENT
      - LATE
    QuestionType:
      type: string
      enum:
      - MCQ
      - STRUCTURED
    AttemptStatus:
      type: string
      enum:
      - IN_PROGRESS
      - SUBMITTED
      - GRADED
    AccessMode:
      type: string
      enum:
      - VIEW_ONLY
      - DOWNLOADABLE
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false
          description: Extends refresh-token lifetime only.
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token: *id021
      required:
      - refresh_token
    AuthSession:
      type: object
      properties:
        access_token: *id021
        refresh_token: *id021
        expires_in: *id020
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        routing_target:
          type: string
          enum:
          - instructor
          - assistant
          - parent
          - student
          description: Where the client should land. Resolved server-side (WF 01).
      required:
      - access_token
      - refresh_token
      - routing_target
    CurrentUser:
      type: object
      properties:
        id: *id022
        email: *id021
        first_name: *id021
        last_name: *id021
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        routing_target: *id021
    RegisterRequest:
      type: object
      properties:
        full_name:
          type: string
          description: WF 02 captures one field; `USERS` splits first/last (gap A21).
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        subjects_taught:
          type: array
          items: *id021
          description: Plural on WF 02; `TEACHERS.specialization` is one string (gap A21).
        curriculum:
          type: string
          enum:
          - IGCSE
          - AMERICAN_DIPLOMA
          - BOTH
          description: No curriculum field exists in the ERD (gap G16).
      required:
      - full_name
      - email
      - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        token: *id021
        password:
          type: string
          format: password
      required:
      - token
      - password
    Profile:
      type: object
      properties:
        id: *id022
        email: *id021
        first_name: *id021
        last_name: *id021
        phone: *id019
        bio: *id019
        specialization: *id019
    ProfileUpdate:
      type: object
      properties:
        first_name: *id021
        last_name: *id021
        phone: *id021
        bio: *id021
        specialization: *id021
    UserSession:
      type: object
      properties:
        user_session_id: *id022
        user_agent: *id019
        ip_address: *id019
        is_revoked: &id028
          type: boolean
        expires_at: &id023
          type: string
          format: date-time
          description: ISO-8601, always UTC.
        created_at: *id023
    InviteCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/InviteRole'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InviteScopeGroup'
          description: ASSISTANT and STUDENT invites. Flags are read only for ASSISTANT.
        linked_student_id:
          type:
          - string
          - 'null'
          format: uuid
          description: PARENT invites only, and required for them. A student issuing a parent invite must
            set this to their own id.
        expires_at:
          type: string
          format: date-time
          description: Optional; the server applies a default window if omitted.
      required:
      - email
      - role
    Invite:
      type: object
      properties:
        invite_id: &id024
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/InviteRole'
        issued_by_user_id: *id024
        issued_by_name:
          type: string
          description: Joined for display — WF 04's "Mr. Ahmed".
        linked_student_id:
          type:
          - string
          - 'null'
          format: uuid
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InviteScopeGroup'
        expires_at: &id025
          type: string
          format: date-time
          description: ISO-8601, always UTC.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        accepted_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Which account it resolved to — a new one, or an existing one it attached to.
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at: *id025
      description: The token itself is never returned. Only `token_hash` is stored, and only the emailed
        link carries the raw value.
    InvitePreview:
      type: object
      properties:
        inviter_name:
          type: string
          description: WF 04's "Mr. Ahmed invited you...".
        role:
          $ref: '#/components/schemas/InviteRole'
        scope_description:
          type: string
          description: Prose built from the scope rows, e.g. "attendance, grading, and homework uploads
            for Section A and Section B".
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InviteScopeGroup'
          description: The structured form, for clients that would rather render it themselves.
        student_name:
          type:
          - string
          - 'null'
          description: PARENT invites — the child being linked.
        expires_at: *id025
      description: Public. Carries nothing about the invitee beyond what they were told in the email.
    InviteAccept:
      type: object
      properties:
        full_name:
          type: string
          description: Ignored when the address already has an account.
        password:
          type: string
          format: password
          description: Ignored when the address already has an account — that path attaches rather than
            creating.
      required:
      - password
    Plan:
      type: object
      properties:
        plan_id: *id022
        name: *id021
        max_students: *id020
        price: &id026
          type: string
          description: Decimal as a string, to avoid float loss. Single implied currency.
        billing_period:
          type: string
          enum:
          - MONTHLY
          - ANNUALLY
    SubscriptionCreate:
      type: object
      properties:
        plan_id: *id022
        payment_token:
          type: string
          description: Opaque token from the payment provider.
      required:
      - plan_id
    SubscriptionUpdate:
      type: object
      properties:
        plan_id: *id022
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
    Subscription:
      type: object
      properties:
        subscription_id: *id022
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - CANCELLED
        start_date: *id023
        end_date: *id023
    Course:
      type: object
      properties:
        course_id: *id022
        course_code: *id021
        subject_name: *id021
        description: *id019
        grade_level: *id019
        fees: *id026
        status:
          $ref: '#/components/schemas/CourseStatus'
        chapter_count: *id020
        group_count: *id020
    CourseCreate:
      type: object
      properties:
        course_code: *id021
        subject_name: *id021
        description: *id021
        grade_level: *id021
        fees: *id026
      required:
      - subject_name
    CourseUpdate:
      type: object
      properties:
        subject_name: *id021
        description: *id021
        grade_level: *id021
        fees: *id026
        status:
          $ref: '#/components/schemas/CourseStatus'
    Chapter:
      type: object
      properties:
        chapter_id: *id022
        course_id: *id022
        title: *id021
        description: *id019
        order_index: *id020
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          description: Present only when `include=lessons`.
    ChapterCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        order_index: *id020
      required:
      - title
    ChapterUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
    Lesson:
      type: object
      properties:
        lesson_id: *id022
        chapter_id: *id022
        title: *id021
        description: *id019
        order_index: *id020
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          description: Gap G3 — this field does not exist in the ERD yet.
        material_count: *id020
        recording_count: *id020
        assignment_count: *id020
    LessonCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        order_index: *id020
      required:
      - title
    LessonUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
    Material:
      type: object
      properties:
        material_id: *id022
        lesson_id: *id022
        title: *id021
        file_url: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        size_bytes:
          type:
          - integer
          - 'null'
          description: Gap A9 — not stored.
        mime_type:
          type:
          - string
          - 'null'
          description: Gap A9 — not stored.
        uploaded_at: *id023
    MaterialCreate:
      type: object
      properties:
        title: *id021
        file_url: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
      required:
      - title
      - file_url
    MaterialUpdate:
      type: object
      properties:
        title: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
    SignedUrl:
      type: object
      properties:
        url: *id021
        expires_at: *id023
        access_mode:
          $ref: '#/components/schemas/AccessMode'
    Recording:
      type: object
      properties:
        recorded_session_id: *id022
        lesson_id: *id022
        title: *id021
        video_url: *id021
        duration_seconds: *id020
        order_index: *id020
        max_watch_limit:
          type: integer
          description: 0 means unlimited. Declarative only in this pass.
        publish_at: &id027
          type:
          - string
          - 'null'
          format: date-time
        deadline: *id027
        recorded_from_live_session_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at: *id023
    RecordingCreate:
      type: object
      properties:
        title: *id021
        video_url: *id021
        duration_seconds: *id020
        order_index: *id020
        max_watch_limit: *id020
        publish_at: *id027
        deadline: *id027
        recorded_from_live_session_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - title
      - video_url
    RecordingUpdate:
      type: object
      properties:
        title: *id021
        max_watch_limit: *id020
        publish_at: *id027
        deadline: *id027
    UploadRequest:
      type: object
      properties:
        filename: *id021
        mime_type: *id021
        size_bytes: *id020
      required:
      - filename
      - mime_type
    UploadTarget:
      type: object
      properties:
        upload_url: *id021
        file_url: *id021
        expires_at: *id023
      required:
      - upload_url
      - file_url
    Assignment:
      type: object
      properties:
        assignment_id: *id022
        lesson_id: *id022
        title: *id021
        description: *id019
        instructions_file_url: *id019
        order_index: *id020
        due_date: *id023
        solution_file_url: *id019
        solution_released_at: *id027
        created_at: *id023
        submission_count: *id020
      description: Curriculum branch. Never scored.
    AssignmentCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        instructions_file_url: *id021
        due_date: *id023
        order_index: *id020
      required:
      - title
      - due_date
    AssignmentUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
        due_date: *id023
    SolutionUpload:
      type: object
      properties:
        solution_file_url: *id021
      required:
      - solution_file_url
    AssignmentSubmissionCreate:
      type: object
      properties:
        file_url: *id021
        student_note:
          type: string
          description: WF 23's optional "Notes for your teacher".
      required:
      - file_url
    AssignmentSubmission:
      type: object
      properties:
        submission_id: *id022
        assignment_id: *id022
        student_id: *id022
        student_name: *id021
        file_url: *id021
        student_note: *id019
        is_late:
          type: boolean
          description: Computed once at submission against `due_date`. Never changes.
        submitted_at: *id023
    Group:
      type: object
      properties:
        group_id: *id022
        course_id: *id022
        group_name: *id021
        schedule_info:
          type:
          - string
          - 'null'
          description: Default recurrence hint. Not authoritative.
        classroom_location:
          type:
          - string
          - 'null'
          description: Default room. Not authoritative.
        max_capacity: *id020
        student_count: *id020
    GroupCreate:
      type: object
      properties:
        group_name: *id021
        schedule_info: *id021
        classroom_location: *id021
        max_capacity: *id020
      required:
      - group_name
    GroupUpdate:
      type: object
      properties:
        group_name: *id021
        schedule_info: *id021
        classroom_location: *id021
        max_capacity: *id020
    EnrollRequest:
      type: object
      properties:
        student_ids:
          type: array
          items: *id022
      required:
      - student_ids
    Student:
      type: object
      properties:
        user_id: *id022
        first_name: *id021
        last_name: *id021
        email: *id021
        student_code: *id019
        school_name: *id019
        grade_level: *id019
    AssistantPermissions:
      type: object
      properties:
        can_take_attendance: *id028
        can_grade: *id028
        can_upload_solutions: *id028
      description: The three checkboxes WF 13 sets at invite time.
    Assistant:
      type: object
      properties:
        user_id: *id022
        first_name: *id021
        last_name: *id021
        email: *id021
        groups:
          type: array
          items:
            type: object
            properties:
              group_id: *id022
              group_name: *id021
              can_take_attendance: *id028
              can_grade: *id028
              can_upload_solutions: *id028
              is_revoked: *id028
              assigned_at: *id023
        scope_label:
          type: string
          description: Rendered for WF 13, e.g. "All sections" or "Section A only".
    AssistantUpdate:
      type: object
      properties:
        group_ids:
          type: array
          items: *id022
        can_take_attendance: *id028
        can_grade: *id028
        can_upload_solutions: *id028
    LiveSession:
      type: object
      properties:
        live_session_id: *id022
        group_id: *id022
        group_name: *id021
        lesson_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Nullable on purpose: revision, exam prep and Q&A map to no lesson.'
        lesson_title: *id019
        title: *id021
        mode:
          $ref: '#/components/schemas/SessionMode'
        meeting_url: *id019
        classroom_location: *id019
        scheduled_start: *id023
        scheduled_end: *id023
        status:
          $ref: '#/components/schemas/SessionStatus'
        created_at: *id023
    LiveSessionCreate:
      type: object
      properties:
        group_id: *id022
        lesson_id:
          type:
          - string
          - 'null'
          format: uuid
        title: *id021
        mode:
          $ref: '#/components/schemas/SessionMode'
        meeting_url:
          type: string
          description: Required when mode is ONLINE.
        classroom_location:
          type: string
          description: Required when mode is ONSITE.
        scheduled_start: *id023
        scheduled_end: *id023
        recurrence:
          type: object
          properties:
            frequency:
              type: string
              enum:
