    get:
      tags:
      - Student portal
      operationId: listMyLessons
      summary: My lessons
      description: "**Published lessons only**, grouped by chapter, each with its materials and recordings.\
        \ Drafts are invisible. There is no per-student view log, so `progress` is always `null`.\n\n\
        **Roles:** S  \n**Ownership scope:** own-enrollment  \n**Wireframe:** 20\n\n**Status:** ✅ Specifiable\
        \ — fully backed by the ERD."
      parameters:
      - *id003
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonProgress'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/assignments:
    get:
      tags:
      - Student portal
      operationId: listMyAssignments
      summary: My homework
      description: "Homework due soon across every enrolled course, sorted by deadline.\n\n**Roles:**\
        \ S  \n**Ownership scope:** own-enrollment  \n**Wireframe:** 19, 23\n\n**Status:** ✅ Specifiable\
        \ — fully backed by the ERD."
      parameters:
      - name: due_before
        in: query
        required: false
        description: Only work due before this instant.
        schema:
          type: string
          format: date-time
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StudentAssignment'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/quizzes:
    get:
      tags:
      - Student portal
      operationId: listMyQuizzes
      summary: My quizzes
      description: "Quizzes open now or opening soon, ordered by `closes_at`.\n\n**Roles:** S  \n**Ownership\
        \ scope:** own-enrollment  \n**Wireframe:** 19, 22\n\n**Status:** ✅ Specifiable — fully backed\
        \ by the ERD."
      parameters:
      - name: state
        in: query
        required: false
        description: '`open`, `upcoming` or `closed`.'
        schema:
          type: string
          enum:
          - open
          - upcoming
          - closed
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StudentQuiz'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/grades:
    get:
      tags:
      - Student portal
      operationId: listMyGrades
      summary: My grades
      description: |-
        Recent **quiz** grades only. Assignments are never scored and do not appear here.

        **Roles:** S  
        **Ownership scope:** own-enrollment  
        **Wireframe:** 19

        **Status:** ✅ Specifiable — fully backed by the ERD.
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AttemptResult'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/schedule:
    get:
      tags:
      - Student portal
      operationId: getMySchedule
      summary: My schedule
      description: |-
        Next session and upcoming classes, with join state from `join_opens_minutes_before` and the pasted `meeting_url`.

        **Roles:** S  
        **Ownership scope:** own-enrollment  
        **Wireframe:** 19

        **Status:** ✅ Specifiable — fully backed by the ERD.
      parameters:
      - name: from
        in: query
        required: false
        description: Window start.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Window end.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LiveSession'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access JWT from login, register, refresh, or invite-accept. Claims are sub (user id), sid (USER_SESSIONS.user_session_id), roles, typ=access, iat, exp. Every request loads the session by sid and rejects it if revoked or expired."
  schemas:
    Empty:
      type: object
      properties: {}
    PageEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
        page:
          type: object
          properties:
            limit: &id020
              type: integer
            cursor: &id019
              type:
              - string
              - 'null'
            next_cursor: *id019
            total: *id020
      description: Standard list envelope.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id021
              type: string
            message: *id021
            details:
              type: array
              items:
                type: object
                properties:
                  field: *id021
                  issue: *id021
          required:
          - code
          - message
      required:
      - error
      description: One problem shape for every failure. `code` is machine-readable and stable.
    ReorderRequest:
      type: object
      properties:
        order:
          type: array
          items: &id022
            type: string
            format: uuid
      required:
      - order
      description: The complete ordered list of ids. The server reassigns every `order_index` in one transaction.
    RoleName:
      type: string
      enum:
      - TEACHER
      - STUDENT
      - ASSISTANT
      - PARENT
      - ADMIN
    CourseStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
    SessionMode:
      type: string
      enum:
      - ONSITE
      - ONLINE
    SessionStatus:
      type: string
      enum:
      - SCHEDULED
      - COMPLETED
      - CANCELLED
    AttendanceStatus:
      type: string
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - PARTIAL
    QuestionType:
      type: string
      enum:
      - MCQ
      - STRUCTURED
    AttemptStatus:
      type: string
      enum:
      - IN_PROGRESS
      - SUBMITTED
      - GRADED
    AccessMode:
      type: string
      enum:
      - VIEW_ONLY
      - DOWNLOADABLE
    TeacherCurriculum:
      type: string
      enum:
      - IGCSE
      - AMERICAN_DIPLOMA
      - BOTH
      description: WF 02 instructor sign-up. `BOTH` means the teacher may create courses of either track.
    CourseCurriculum:
      type: string
      enum:
      - IGCSE
      - AMERICAN_DIPLOMA
      description: A course is one track. Parent child cards concatenate this with `SUBJECTS.name`.
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false
          description: Stored on `USER_SESSIONS.remember_me`. Refresh lifetime 30 days when true, 7 days when false. Access JWT stays 15 minutes.
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token: *id021
      required:
      - refresh_token
    AuthSession:
      type: object
      properties:
        access_token: *id021
        refresh_token: *id021
        expires_in:
          type: integer
          description: Access-token lifetime in seconds. Always `900` (15 minutes).
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
    CurrentUser:
      type: object
      properties:
        id: *id022
        email: *id021
        full_name: *id021
        avatar_url: *id019
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        routing_target:
          type: string
          enum:
          - instructor
          - assistant
          - parent
          - student
          description: Where the client should land. First matching role in order TEACHER, ASSISTANT, PARENT, STUDENT.
      required:
      - id
      - email
      - full_name
      - roles
      - routing_target
    RegisterRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          description: WF 02 one field. Stored on `USERS.full_name`.
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        subject_ids:
          type: array
          minItems: 1
          items: *id022
          description: WF 02 multi-select. Catalog ids from `GET /subjects`. Stored as `TEACHER_SUBJECTS`. Each subject's curriculum must be allowed by `curriculum`.
        curriculum:
          $ref: '#/components/schemas/TeacherCurriculum'
      required:
      - full_name
      - email
      - password
      - curriculum
      - subject_ids
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    VerifyPasswordOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6-digit code emailed by `POST /auth/password/forgot`.
      required:
      - email
      - otp
    VerifyPasswordOtpResponse:
      type: object
      properties:
        reset_token:
          type: string
          description: Opaque one-time token. Send it to `POST /auth/password/reset`. Not the OTP.
        expires_in:
          type: integer
          description: Seconds until the token expires. Always 600 (10 minutes from verify).
      required:
      - reset_token
      - expires_in
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        reset_token:
          type: string
          description: From `POST /auth/password/otp/verify`. Not the 6-digit OTP.
        password:
          type: string
          format: password
          minLength: 8
      required:
      - email
      - reset_token
      - password
    Profile:
      type: object
      properties:
        id: *id022
        email: *id021
        full_name: *id021
        avatar_url: *id019
        phone: *id019
        bio: *id019
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
          description: Instructor only. From `TEACHER_SUBJECTS`.
        curriculum:
          $ref: '#/components/schemas/TeacherCurriculum'
        school_name: *id019
        grade_level: *id019
    ProfileUpdate:
      type: object
      properties:
        full_name: *id021
        avatar_url: *id021
        phone: *id021
        bio: *id021
        subject_ids:
          type: array
          minItems: 1
          items: *id022
          description: Instructor only. Replaces the whole `TEACHER_SUBJECTS` set. Each id from `GET /subjects`.
        curriculum:
          $ref: '#/components/schemas/TeacherCurriculum'
        school_name: *id021
        grade_level: *id021
    UserSession:
      type: object
      properties:
        user_session_id: *id022
        user_agent: *id019
        ip_address: *id019
        is_revoked: &id028
          type: boolean
        remember_me: *id028
        is_current:
          type: boolean
          description: True when this row is the `sid` in the caller's access token.
        expires_at: &id023
          type: string
          format: date-time
          description: ISO-8601, always UTC.
        created_at: *id023
    InviteCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          description: Name the issuer types (WF 13 modal; student/parent names are pre-set). Copied to `USERS.full_name` on accept unless the accept body overrides it.
        role:
          $ref: '#/components/schemas/InviteRole'
        group_ids:
          type: array
          items: *id022
          description: ASSISTANT and STUDENT — at least one. PARENT — omit or empty.
        linked_student_id:
          type:
          - string
          - 'null'
          format: uuid
          description: PARENT invites only, and required for them. A student issuing a parent invite must
            set this to their own id.
        expires_at:
          type: string
          format: date-time
          description: Optional. Default is now + 7 days. Must be in the future.
      required:
      - email
      - full_name
      - role
    Invite:
      type: object
      properties:
        invite_id: &id024
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
          description: The invitee's name as typed by the issuer. WF 13 pending rows use this before acceptance.
        role:
          $ref: '#/components/schemas/InviteRole'
        issued_by_user_id: *id024
        issued_by_name:
          type: string
          description: Joined for display — WF 04's "Mr. Ahmed".
        linked_student_id:
          type:
          - string
          - 'null'
          format: uuid
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InviteScopeGroup'
        expires_at: &id025
          type: string
          format: date-time
          description: ISO-8601, always UTC.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        accepted_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Which account it resolved to — a new one, or an existing one it attached to.
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_by_user_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at: *id025
      description: The token itself is never returned. Only `token_hash` is stored, and only the emailed
        link carries the raw value.
    InvitePreview:
      type: object
      properties:
        inviter_name:
          type: string
          description: WF 04's "Mr. Ahmed invited you...".
        role:
          $ref: '#/components/schemas/InviteRole'
        scope_description:
          type: string
          description: Prose built from the scoped groups, e.g. "Section A and Section B. The instructor will set what you can do after you activate".
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InviteScopeGroup'
          description: The structured form, for clients that would rather render it themselves.
        student_name:
          type:
          - string
          - 'null'
          description: PARENT invites — the child being linked.
        expires_at: *id025
      description: Public. Carries nothing about the invitee beyond what they were told in the email.
    InviteAccept:
      type: object
      properties:
        full_name:
          type: string
          description: TA setup (WF 04) collects this. Student and parent setup omit it; acceptance then copies `INVITES.full_name`. Ignored when the address already has an account.
        password:
          type: string
          format: password
          minLength: 8
          description: Always required. Creates the password for a new account, or verifies it when attaching to an existing one.
      required:
      - password
    Plan:
      type: object
      properties:
        plan_id: *id022
        name: *id021
        max_students: *id020
        max_ta_seats: *id020
        price: &id026
          type: string
          description: Decimal as a string, to avoid float loss. Single implied currency.
        billing_period:
          type: string
          enum:
          - MONTHLY
          - ANNUALLY
    SubscriptionCreate:
      type: object
      properties:
        plan_id: *id022
        payment_token:
          type: string
          description: Opaque token from the payment provider.
      required:
      - plan_id
    SubscriptionUpdate:
      type: object
      properties:
        plan_id: *id022
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
    Subscription:
      type: object
      properties:
        subscription_id: *id022
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - CANCELLED
        start_date: *id023
        end_date: *id023
    Subject:
      type: object
      properties:
        subject_id: *id022
        name: *id021
        curriculum:
          $ref: '#/components/schemas/CourseCurriculum'
      required:
      - subject_id
      - name
      - curriculum
      description: One catalog row. Same display name on both tracks is two rows. Array order is display order; `order_index` is not exposed.
    Course:
      type: object
      properties:
        course_id: *id022
        title: *id021
        course_code: *id021
        subject_id: *id022
        subject_name:
          type: string
          description: Read-side join of `SUBJECTS.name`. Not stored on `COURSES`.
        curriculum:
          $ref: '#/components/schemas/CourseCurriculum'
        description: *id019
        grade_level: *id019
        fees: *id026
        status:
          $ref: '#/components/schemas/CourseStatus'
        chapter_count: *id020
        group_count: *id020
    CourseCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: WF 07 header. Typically the term (e.g. Term 1). A second term is a second course.
        course_code: *id021
        subject_id: *id022
        curriculum:
          $ref: '#/components/schemas/CourseCurriculum'
        description: *id021
        grade_level: *id021
        fees: *id026
      required:
      - title
      - subject_id
      - curriculum
    CourseUpdate:
      type: object
      properties:
        title: *id021
        subject_id: *id022
        curriculum:
          $ref: '#/components/schemas/CourseCurriculum'
        description: *id021
        grade_level: *id021
        fees: *id026
        status:
          $ref: '#/components/schemas/CourseStatus'
    Chapter:
      type: object
      properties:
        chapter_id: *id022
        course_id: *id022
        title: *id021
        description: *id019
        order_index: *id020
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          description: Present only when `include=lessons`.
    ChapterCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        order_index: *id020
      required:
      - title
    ChapterUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
    Lesson:
      type: object
      properties:
        lesson_id: *id022
        chapter_id: *id022
        title: *id021
        description: *id019
        order_index: *id020
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          description: New lessons start `DRAFT`. Only `PUBLISHED` is visible to students and parents.
        material_count: *id020
        recording_count: *id020
        assignment_count: *id020
    LessonCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        order_index: *id020
      required:
      - title
    LessonUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
    Material:
      type: object
      properties:
        material_id: *id022
        lesson_id: *id022
        title: *id021
        file_url: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        size_bytes:
          type:
          - integer
          - 'null'
          description: Gap A9 — not stored.
        mime_type:
          type:
          - string
          - 'null'
          description: Gap A9 — not stored.
        uploaded_at: *id023
    MaterialCreate:
      type: object
      properties:
        title: *id021
        file_url: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
      required:
      - title
      - file_url
    MaterialUpdate:
      type: object
      properties:
        title: *id021
        access_mode:
          $ref: '#/components/schemas/AccessMode'
    SignedUrl:
      type: object
      properties:
        url: *id021
        expires_at: *id023
        access_mode:
          $ref: '#/components/schemas/AccessMode'
    Recording:
      type: object
      properties:
        recorded_session_id: *id022
        lesson_id: *id022
        title: *id021
        video_url: *id021
        duration_seconds: *id020
        order_index: *id020
        max_watch_limit:
          type: integer
          description: 0 means unlimited. Declarative only in this pass.
        publish_at: &id027
          type:
          - string
          - 'null'
          format: date-time
        deadline: *id027
        recorded_from_live_session_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at: *id023
    RecordingCreate:
      type: object
      properties:
        title: *id021
        video_url: *id021
        duration_seconds: *id020
        order_index: *id020
        max_watch_limit: *id020
        publish_at: *id027
        deadline: *id027
        recorded_from_live_session_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - title
      - video_url
    RecordingUpdate:
      type: object
      properties:
        title: *id021
        max_watch_limit: *id020
        publish_at: *id027
        deadline: *id027
    UploadRequest:
      type: object
      properties:
        filename: *id021
        mime_type: *id021
        size_bytes: *id020
      required:
      - filename
      - mime_type
    UploadTarget:
      type: object
      properties:
        upload_url: *id021
        file_url: *id021
        expires_at: *id023
      required:
      - upload_url
      - file_url
    Assignment:
      type: object
      properties:
        assignment_id: *id022
        lesson_id: *id022
        title: *id021
        description: *id019
        instructions_file_url: *id019
        order_index: *id020
        due_date: *id023
        solution_file_url: *id019
        solution_released_at: *id027
        created_at: *id023
        submission_count: *id020
      description: Curriculum branch. Never scored.
    AssignmentCreate:
      type: object
      properties:
        title: *id021
        description: *id021
        instructions_file_url: *id021
        due_date: *id023
        order_index: *id020
      required:
      - title
      - due_date
    AssignmentUpdate:
      type: object
      properties:
        title: *id021
        description: *id021
        due_date: *id023
    SolutionUpload:
      type: object
      properties:
        solution_file_url: *id021
      required:
      - solution_file_url
    AssignmentSubmissionCreate:
      type: object
      properties:
        file_url: *id021
        student_note:
          type: string
          description: WF 23's optional "Notes for your teacher".
      required:
      - file_url
    AssignmentSubmission:
      type: object
      properties:
        submission_id: *id022
        assignment_id: *id022
        student_id: *id022
        student_name: *id021
        file_url: *id021
        student_note: *id019
        is_late:
          type: boolean
          description: Computed once at submission against `due_date`. Never changes.
        submitted_at: *id023
    Group:
      type: object
      properties:
        group_id: *id022
        course_id: *id022
        group_name: *id021
        schedule_info:
          type:
          - string
          - 'null'
          description: Default recurrence hint. Not authoritative.
        classroom_location:
          type:
          - string
          - 'null'
          description: Default room. Not authoritative.
        max_capacity: *id020
        student_count: *id020
    GroupCreate:
      type: object
      properties:
        group_name: *id021
        schedule_info: *id021
