# Generated for GitBook. Source of truth: docs/erd.md + docs/api-resource-map.md
openapi: 3.1.0
info:
  title: Montu E-Learning Platform API
  version: 0.1.0-draft
  description: |-
    REST API for the Montu e-learning platform — a centralized LMS for independent IGCSE and American-Diploma instructors, serving four linked tiers: instructor, teaching assistant, parent and student.

    **This is a specification, not a description of running code.** The backend is scaffolding only. Every endpoint is derived from the entity-relationship diagram and the 24-screen wireframe set, and each one carries a status line saying whether it is fully backed by the schema, depends on an open decision, or is blocked on a missing entity.

    Read the *Concepts* section first — the path conventions, the role and ownership model, the two-branch rule and the error catalog apply to every operation and are not repeated per endpoint.
  contact:
    name: Montu Tech
servers:
- url: https://api.montu.example/api/v1
  description: Production (not yet deployed)
- url: http://localhost:3000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Login, token rotation, sign-up, password reset and profile.
- name: Invites
  description: Instructor-issued invites — the only route to a TA, student or parent account.
- name: Billing
  description: Instructor → platform subscriptions. Distinct from student fees.
- name: Subjects
  description: Platform catalog of subjects, filtered by curriculum. Frontend never hardcodes names.
- name: Courses
  description: The curriculum root.
- name: Chapters
  description: Chapters within a course.
- name: Lessons
  description: Lessons within a chapter, and publish state.
- name: Materials
  description: Files attached to a lesson.
- name: Recordings
  description: On-demand video attached to a lesson.
- name: Uploads
  description: Signed upload targets. Transport only.
- name: Assignments
  description: Homework — curriculum branch, checked for on-time submission, never scored.
- name: Groups
  description: Cohorts, called "sections" in the wireframes.
- name: Assistants
  description: TA scope and the three permission flags.
- name: Scheduling
  description: Live sessions, onsite and online.
- name: Attendance
  description: Recorded against a live session, never against a lesson.
- name: Quizzes
  description: Timed assessments — cohort branch, issued to one group.
- name: Quiz attempts
  description: The student-side attempt lifecycle.
- name: Grading
  description: The TA grading queue for structured answers.
- name: Roster
  description: Students and their computed aggregates.
- name: Dashboards
  description: Per-role landing screens.
- name: Fees
  description: Student → instructor payments.
- name: Parent portal
  description: Read-only views of linked children.
- name: Notifications
  description: The in-app feed.
- name: Events
  description: Server-Sent Events — the real-time transport.
- name: Student portal
  description: Enrollment-scoped reads.
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in
      description: "Exchanges credentials for an access token and a refresh token. Creates a `USER_SESSIONS`\
        \ row. `remember_me` sets refresh lifetime to 30 days; otherwise 7 days. Access JWT is always\
        \ 15 minutes (`expires_in` = 900).\n\nWrong email and wrong password both return `401 INVALID_CREDENTIALS`.\
        \ A correct password on an inactive account returns `403 ACCOUNT_DISABLED`.\n\n**Roles:** —  \n\
        **Ownership scope:** —  \n**Wireframe:** 01\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Rotate refresh token
      description: "Exchanges a refresh token for a new pair. The old token is revoked on use — rotation\
        \ writes a new `USER_SESSIONS.refresh_token_hash`. A rotated, expired, or unknown refresh token\
        \ is `401 INVALID_CREDENTIALS`.\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:** —\n\
        \n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/401'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Log out
      description: "Revokes the current session by setting `USER_SESSIONS.is_revoked` on the `sid` in the\
        \ access token.\n\n**Roles:** all  \n**Ownership scope:** self  \n**Wireframe:** —\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401'
  /auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Current user
      description: "The caller's profile, roles and routing target.\n\n**Roles:** all  \n**Ownership scope:**\
        \ self  \n**Wireframe:** all\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /auth/register:
    post:
      tags:
      - Authentication
      operationId: registerInstructor
      summary: Register as instructor
      description: "Step 1 of 3 of instructor sign-up. Creates the `USERS` row, the `TEACHERS` profile\
        \ and the `TEACHER` role assignment. Only instructors may self-register; every other account arrives\
        \ by invite. Duplicate email is `409 EMAIL_TAKEN`. `subject_ids` must come from `GET /subjects`\
        \ and each subject's curriculum must be allowed by `curriculum` (`422 SUBJECT_CURRICULUM_MISMATCH`).\
        \ Returns `201` and an `AuthSession` so the client can continue to plan selection (step 2).\n\n\
        **Roles:** —  \n**Ownership scope:** —  \n**Wireframe:** 02\n\n**Status:** ✅ Specifiable — fully\
        \ backed by the ERD."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
  /auth/password/forgot:
    post:
      tags:
      - Authentication
      operationId: forgotPassword
      summary: Request a password reset
      description: |-
        Emails a 6-digit OTP. **Always returns 202**, whether or not the address matches an account —
        leaking account existence is the failure mode here (WF 03). A new request replaces any live OTP
        or unused reset token for that user (new hash, new expiry, attempt count reset).

        **Screen 1** of the forgot-password flow. The client then shows the OTP field.

        **Roles:** —  
        **Ownership scope:** —  
        **Wireframe:** 03

        **Status:** ✅ Specifiable — fully backed by the ERD. The OTP is stored in cache, not a table.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
  /auth/password/otp/verify:
    post:
      tags:
      - Authentication
      operationId: verifyPasswordOtp
      summary: Verify the password-reset OTP
      description: |-
        **Screen 2.** Checks the 6-digit code from the email. On success the OTP is consumed and the
        response carries a one-time `reset_token`. The client then shows the new-password screen.

        A wrong code and an unknown email both return `401 INVALID_OTP`. An expired, already-used,
        or locked code returns `410 OTP_EXPIRED` and the screen offers to resend (WF 03).

        **Roles:** —  
        **Ownership scope:** —  
        **Wireframe:** 03

        **Status:** ✅ Specifiable — fully backed by the ERD. The OTP is stored in cache, not a table.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordOtpRequest'
      responses:
        '200':
          description: OTP accepted. Use `reset_token` on the next call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasswordOtpResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '410':
          $ref: '#/components/responses/410'
  /auth/password/reset:
    post:
      tags:
      - Authentication
      operationId: resetPassword
      summary: Reset a password
      description: |-
        **Screen 3.** Sets the new password using the `reset_token` from `POST /auth/password/otp/verify`.
        The OTP is not sent again. A bad or unknown token returns `401 INVALID_OTP`. An expired or
        already-used token returns `410 OTP_EXPIRED`.

        On success the cache key is deleted and every `USER_SESSIONS` row for that user is revoked.

        **Roles:** —  
        **Ownership scope:** —  
        **Wireframe:** 03

        **Status:** ✅ Specifiable — fully backed by the ERD. The OTP is stored in cache, not a table.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '410':
          $ref: '#/components/responses/410'
  /me/profile:
    get:
      tags:
      - Authentication
      operationId: getProfile
      summary: Get own profile
      description: "Profile tab on WF 13 (instructor) and WF 19 (student). Role-specific fields are null\
        \ when they do not apply (`curriculum` for a student, `phone` for an instructor, etc).\n\n**Roles:**\
        \ all  \n**Ownership scope:** self  \n**Wireframe:** 13, 19\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
      - Authentication
      operationId: updateProfile
      summary: Update own profile
      description: "Partial update. Only fields present in the body are changed. Fields this role cannot\
        \ write return `422 FIELD_NOT_ALLOWED` (see Authentication implementation contract). Email is not\
        \ editable.\n\n**Roles:** all  \n**Ownership scope:** self  \n**Wireframe:** 13, 19\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
  /me/sessions:
    get:
      tags:
      - Authentication
      operationId: listSessions
      summary: List active devices
      description: "Active refresh-token sessions. `is_current` is true for the `sid` in the caller's access\
        \ token. No wireframe lists devices; the data exists and the endpoint is part of auth.\n\n**Roles:**\
        \ all  \n**Ownership scope:** self  \n**Wireframe:** —\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - &id001
        name: limit
        in: query
        required: false
        description: Page size (default 25, max 100).
        schema:
          type: integer
          default: 25
          maximum: 100
      - &id002
        name: cursor
        in: query
        required: false
        description: Opaque cursor from a previous response's `page.next_cursor`.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/sessions/{sessionId}:
    delete:
      tags:
      - Authentication
      operationId: revokeSession
      summary: Revoke a device
      description: "Sets `is_revoked` on one of the caller's sessions. Revoking the current session is\
        \ allowed and signs the caller out.\n\n**Roles:** all  \n**Ownership scope:** self  \n**Wireframe:**\
        \ —\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: sessionId
        in: path
        required: true
        description: The session to revoke.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /invites:
    post:
      tags:
      - Invites
      operationId: createInvite
      summary: Issue an invite
      description: "Issues an invite. Sends the email as a side effect; the raw token is never in the JSON.\n\
        \n**Upsert.** A second `POST` for the same live `(email, role, issuer)` rotates the token, replaces\
        \ name/groups/expiry, and returns **200**. A new row returns **201**.\n\nA student may issue only\
        \ `PARENT`, with `linked_student_id` equal to themselves. Instructors may issue `ASSISTANT`, `STUDENT`,\
        \ or `PARENT`. Every `group_id` must belong to a course the issuing instructor owns.\n\n**Roles:**\
        \ I, S  \n**Ownership scope:** own-course / self  \n**Wireframe:** WF 13, WF 05\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '200':
          description: Live invite updated (resend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
    get:
      tags:
      - Invites
      operationId: listInvites
      summary: List pending invites
      description: "Invites issued by the caller that are still outstanding — neither accepted nor rescinded.\n\
        \n**Roles:** I, S  \n**Ownership scope:** own-course / self  \n**Wireframe:** WF 13\n\n**Status:**\
        \ ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: role
        in: query
        required: false
        description: Filter by invited role.
        schema:
          $ref: '#/components/schemas/InviteRole'
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /invites/{inviteId}:
    delete:
      tags:
      - Invites
      operationId: revokeInvite
      summary: Rescind an invite
      description: "Rescinds a pending invite by stamping `revoked_at` and `revoked_by_user_id`. **The\
        \ row is not deleted.** Allowed actors: the issuer; for a student-issued parent invite, also any\
        \ instructor who owns a course that child is enrolled in.\n\nAlready accepted or already rescinded\
        \ is `409 INVITE_NOT_PENDING`.\n\n**Roles:** I, S  \n**Ownership scope:** own-course / self  \n\
        **Wireframe:** WF 13\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: inviteId
        in: path
        required: true
        description: The invite to rescind.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
  /invite-tokens/{token}:
    get:
      tags:
      - Invites
      operationId: previewInvite
      summary: Preview an invite
      description: "**Public.** Returns the inviter's name, the offered role, and the scope rendered as\
        \ prose.\n\nThis is what WF 04 shows a teaching assistant before they activate: *\"Mr. Ahmed invited\
        \ you as a Teaching Assistant — you'll have access to his classes. He'll set what you can do after\
        \ you activate.\"* The name comes from joining the invite to its issuing user; the sentence is\
        \ built from the `INVITE_GROUPS` group names, not from permission flags.\n\nA token that is spent, rescinded\
        \ or expired returns `410`, never `404` — the recipient followed a real link and should be told\
        \ it is no longer valid rather than that it never existed. Code `INVITE_INVALID`. Unknown tokens\
        \ are also `410`, not `404`.\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:** WF 04,\
        \ WF 05\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: The invite token from the emailed link.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '410':
          $ref: '#/components/responses/410'
  /invite-tokens/{token}/accept:
    post:
      tags:
      - Invites
      operationId: acceptInvite
      summary: Accept an invite
      description: "Consumes the invite in one transaction. The token alone identifies it — the body has\
        \ no email (WF 04/05 never collect one).\n\n| Role | Writes |\n|---|---|\n| `ASSISTANT` | `GROUP_ASSISTANTS`\
        \ per group, flags all false |\n| `STUDENT` | `STUDENT_GROUPS` plus a `STUDENTS` row if new |\n\
        | `PARENT` | `PARENT_STUDENTS` plus a `PARENTS` row if new |\n\n`password` is always required.\
        \ Unknown email creates the account. Known email verifies the password (`401 INVALID_CREDENTIALS`\
        \ if wrong) and attaches. A `TEACHER` account cannot accept: `409 INSTRUCTOR_CANNOT_ACCEPT_INVITE`.\
        \ Empty scope after archived groups: `410 INVITE_INVALID`.\n\n**Roles:** —  \n**Ownership scope:**\
        \ —  \n**Wireframe:** WF 04, WF 05\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: The invite token.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
  /plans:
    get:
      tags:
      - Billing
      operationId: listPlans
      summary: List subscription plans
      description: "Plan tiers for sign-up step 2.\n\n**Roles:** —  \n**Ownership scope:** —  \n**Wireframe:**\
        \ 02\n\n**Status:** ✅ Specifiable — `max_students` and `max_ta_seats` size the plan (WF 02)."
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
  /subscriptions:
    post:
      tags:
      - Billing
      operationId: createSubscription
      summary: Subscribe to a plan
      description: "Sign-up step 3. Payment processing is delegated to a provider; this endpoint takes\
        \ the provider's token and records the `SUBSCRIPTIONS` row.\n\n**Roles:** I  \n**Ownership scope:**\
        \ self  \n**Wireframe:** 02\n\n**Status:** ⚠️ Payment provider integration is out of scope for\
        \ this document."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /me/subscription:
    get:
      tags:
      - Billing
      operationId: getSubscription
      summary: Get own subscription
      description: "Billing tab on WF 13.\n\n**Roles:** I  \n**Ownership scope:** self  \n**Wireframe:**\
        \ 13\n\n**Status:** ✅ Specifiable — fully backed by the ERD."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      tags:
      - Billing
      operationId: updateSubscription
      summary: Change or cancel plan
      description: "Switches plan or sets `status = CANCELLED`.\n\n**Roles:** I  \n**Ownership scope:**\
        \ self  \n**Wireframe:** 13\n\n**Status:** ⚠️ No screen edits plan limits or subscription state\
        \ (gap B2)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /subjects:
    get:
      tags:
      - Subjects
      operationId: listSubjects
      summary: List subjects
      description: "Platform catalog for the curriculum filter on sign-up (WF 02) and course create (WF\
        \ 07). Omit `curriculum` to return both tracks; pass `IGCSE` or `AMERICAN_DIPLOMA` to filter.\
        \ Inactive catalog rows are omitted. Same display name on both tracks is two rows (two ids).\n\
        \nThe client never hardcodes subject names — pick `subject_id` from this list and send it on\
        \ `POST /auth/register` (`subject_ids`) and `POST /courses` (`subject_id`).\n\n**Roles:** —  \n\
        **Ownership scope:** —  \n**Wireframe:** 02, 07\n\n**Status:** ✅ Specifiable — fully backed by\
        \ the ERD."
      security: []
      parameters:
      - name: curriculum
        in: query
        required: false
        description: Restrict to one track. Omit for both.
        schema:
          $ref: '#/components/schemas/CourseCurriculum'
      responses:
        '200':
          description: Active catalog rows, already sorted for display within each curriculum.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/400'
  /courses:
    get:
      tags:
