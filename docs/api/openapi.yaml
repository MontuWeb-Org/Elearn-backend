        \ | WF 22, WF 18 |\n| `POST /lessons/{id}/publish` | `content.published` | WF 20, WF 17 |\n| `POST\
        \ /assignments/{id}/solution/release` | `content.published` | WF 20 |\n| `POST` or `PATCH /live-sessions`\
        \ | `schedule.changed` | WF 19, WF 17 |\n| `POST /payments` | `fee.paid` | WF 17 badge clears\
        \ |\n| `POST /fees/{id}/remind` | `notification.created` | WF 17 |\n\nEvents are scoped to the\
        \ caller: a parent receives only events about linked children, a student only their own.\n\n**Roles:**\
        \ all  \n**Ownership scope:** self  \n**Wireframe:** 08, 09, 10, 15, 16, 17, 18\n\n**Status:**\
        \ ⚠️ The scope document asserts real-time synchronization on seven screens but never specifies\
        \ the mechanism (gap D23). SSE is the proposal here because all seven flows are one-way and read-only,\
