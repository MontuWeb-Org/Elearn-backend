  /attempts/{attemptId}/finalize:
    post:
      tags:
      - Grading
      operationId: finalizeAttempt
      summary: Finalize grading
      description: "Computes `total_score` as the sum of all `points_awarded`, sets `status = GRADED`,\
        \ stamps the attempt's `graded_by_user_id` and `graded_at`, and fires the student and parent fan-out\
        \ (`quiz.graded`).\n\nReturns `409 ATTEMPT_INCOMPLETE` if any structured answer is still ungraded.\n\
        \n**Authorization.** Every endpoint in this group requires `can_grade` on the group that owns\
        \ the answer, resolved through `attempt → quiz → group`, with `is_revoked = false`. The course's\
        \ owning instructor always passes. A TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\
        \n**Roles:** I, A  \n**Ownership scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n\
        **Status:** ⚠️ **Auto-finalize or explicit?** Either the last `PATCH /answers/{id}/grade` on an\
        \ attempt flips it to `GRADED` automatically, or finalize stays a deliberate second step so a\
        \ grader can review the whole paper before releasing it. Auto-finalize fits WF 15 better — its\
        \ queue is answer-at-a-time across many students and never shows a whole paper — with this endpoint\
        \ kept as an instructor override. Undecided; it changes whether the fan-out has one trigger or\
        \ two (gap D38). Regrades also overwrite rather than append, so a TA's original score is lost\
        \ when an instructor overrides it (gap D9)."
      parameters:
      - *id014
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttempt'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
