        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingQueueItem'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /grading/queue/{answerId}/skip:
    post:
      tags:
      - Grading
      operationId: skipGradingItem
      summary: Skip an item
      description: "Releases the claim and returns the answer to the pool.\n\n**Authorization.** Every\
        \ endpoint in this group requires `can_grade` on the group that owns the answer, resolved through\
        \ `attempt → quiz → group`, with `is_revoked = false`. The course's owning instructor always passes.\
