      operationId: listQuizAttempts
      summary: List attempts for a quiz
      description: "Per-quiz grading view: every attempt with its pending-answer count. Backs WF 15's\
        \ \"Quiz — Kinematics (24 pending)\" header and the \"18/24 already complete\" line.\n\n**Authorization.**\
        \ Every endpoint in this group requires `can_grade` on the group that owns the answer, resolved\
        \ through `attempt → quiz → group`, with `is_revoked = false`. The course's owning instructor\
        \ always passes. A TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\n**Roles:** I,\
        \ A  \n**Ownership scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n**Status:** ✅ Specifiable\
        \ — fully backed by the ERD."
