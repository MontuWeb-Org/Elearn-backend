  responses:
    '400':
      description: Malformed request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Authenticated, but the caller lacks the required role, ownership scope or permission
        flag (`INSUFFICIENT_SCOPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: No such resource, or the caller may not see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Conflict with current state — a uniqueness constraint, a lock, or a RESTRICT delete
        rule.
      content:
