  /grading/queue:
    get:
      tags:
      - Grading
      operationId: getGradingQueue
      summary: Get the grading queue
      description: "**The WF 15 dashboard.** Ungraded structured answers across every group the caller\
        \ may grade.\n\nThe queue is a *query, not a table*: `QUIZ_ANSWERS` where `points_awarded IS NULL`,\
        \ joined to `QUIZ_QUESTIONS` on `question_type = 'STRUCTURED'` and to `GROUP_ASSISTANTS` for scope.\
        \ The partial index `QUIZ_ANSWERS (attempt_id) WHERE points_awarded IS NULL` exists for exactly\
        \ this.\n\n**The unit of work is one answer, not one attempt.** WF 15 serves \"Youssef T. — Q4\
        \ (structured answer)\" with its own score box. Two TAs may legitimately grade different questions\
        \ of the same student's paper, which is why grader attribution lives on the answer.\n\nEach item\
        \ carries the student, the question text, the points available, the student's answer and the `model_answer`.\n\
        \n**Authorization.** Every endpoint in this group requires `can_grade` on the group that owns\
        \ the answer, resolved through `attempt → quiz → group`, with `is_revoked = false`. The course's\
        \ owning instructor always passes. A TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\
        \n**Roles:** I, A  \n**Ownership scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n\
        **Status:** ✅ Specifiable — fully backed by the ERD."
      parameters:
      - name: quiz_id
        in: query
        required: false
        description: Filter to one quiz.
        schema:
          type: string
          format: uuid
      - name: group_id
        in: query
        required: false
        description: Filter to one section.
        schema:
          type: string
          format: uuid
      - name: course_id
        in: query
        required: false
        description: Filter to one course.
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/GradingQueueItem'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /grading/summary:
    get:
      tags:
      - Grading
      operationId: getGradingSummary
      summary: Get pending counts
      description: "Counts for the badges — pending answers per quiz and per group. Backs WF 06's \"24\
        \ pending\" tile and the WF 14 TA dashboard.\n\n**Authorization.** Every endpoint in this group\
        \ requires `can_grade` on the group that owns the answer, resolved through `attempt → quiz → group`,\
