      operationId: gradeAnswersBulk
      summary: Grade answers in bulk
      description: "**Bulk save.** An array of `{answer_id, points_awarded, evaluator_comment}`.\n\nOne\
        \ round trip per essay is the wrong shape at 150+ students; this is the endpoint a grading session\
        \ should actually use. Partial success is reported per item rather than failing the whole batch.\n\
        \n**Authorization.** Every endpoint in this group requires `can_grade` on the group that owns\
        \ the answer, resolved through `attempt → quiz → group`, with `is_revoked = false`. The course's\
        \ owning instructor always passes. A TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\
        \n**Roles:** I, A  \n**Ownership scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n\
        **Status:** ✅ Specifiable — fully backed by the ERD."
      requestBody:
        required: true
