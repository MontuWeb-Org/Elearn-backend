        \ aggregate here is computed on read and never stored.\n\n**Roles:** I, A  \n**Ownership scope:**\
        \ own-course  \n**Wireframe:** 11\n\n**Status:** ⚠️ Three unresolved dependencies. The `Section`\
        \ column assumes one group per student, but `STUDENT_GROUPS` is many-to-many (gaps C13, D4). \"\
        Missing\" homework is the absence of a submission row past the deadline — derivable now, but which\
        \ assignments a student is expected to have done depends on ERD Open Question 1. And the attendance-%\
        \ denominator is undefined until cancelled-session handling is settled (gaps C16, D15)."
