  /grading/queue/next:
    get:
      tags:
      - Grading
      operationId: getNextGradingItem
      summary: Serve the next item
      description: "Returns the next ungraded answer and takes a **soft claim** on it — `claimed_by_user_id`\
        \ and `claimed_at`. This is what makes \"Skip\" work without re-serving the same essay to the\
        \ same grader.\n\n**Authorization.** Every endpoint in this group requires `can_grade` on the\
        \ group that owns the answer, resolved through `attempt → quiz → group`, with `is_revoked = false`.\
        \ The course's owning instructor always passes. A TA with \"Attendance only\" gets `403 INSUFFICIENT_SCOPE`.\n\
        \n**Roles:** I, A  \n**Ownership scope:** assigned-group + can_grade  \n**Wireframe:** 15\n\n\
        **Status:** ⚠️ The claim is advisory, expires after a few minutes, and never blocks a grade. It\
        \ exists because WF 13 shows two TAs and the persona has 150+ students, so concurrent grading\
        \ is real. If only one person ever grades, drop this endpoint, `/skip`, and both claim columns,\
        \ and page through `/grading/queue` instead."
      parameters:
      - name: quiz_id
        in: query
        required: false
        description: Restrict to one quiz.
        schema:
          type: string
          format: uuid
