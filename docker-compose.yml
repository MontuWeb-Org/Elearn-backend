services:
  postgres:
    image: postgres:16-alpine
    container_name: elearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elearn
      POSTGRES_PASSWORD: elearn
      POSTGRES_DB: elearn_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elearn -d elearn_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: elearn-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
