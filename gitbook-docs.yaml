$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Montu Docs
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home/home
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation/documentation
    - type: section
      key: section-3
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-3
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog/changelog
    - type: section
      key: section-4
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-4
          title: Help Center
          path: help-center
          default: true
          content:
            directory: ./help-center/help-center
    - type: section
      key: section-5
      title: API Reference
      path: api-reference-1
      children:
        - type: space
          key: space-5
          title: API Reference
          path: api-reference
          default: true
          draft: true
          content:
            directory: ./api-reference-1/api-reference
    - type: section
      key: section-6
      title: API Docs
      path: api-docs
      default: true
      children:
        - type: space
          key: space-6
          title: API Docs
          path: api-docs
          default: true
          draft: true
          content:
            directory: ./docs/api
